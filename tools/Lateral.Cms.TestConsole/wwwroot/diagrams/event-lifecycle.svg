<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" width="1180" height="740" role="img" aria-label="The life of an event">
  <style>
    :root { --bg:#ffffff; --box:#f3f5fb; --stroke:#c4cce0; --text:#1a2133; --muted:#5b6579;
            --ingest:#3552d6; --asset:#1f9d63; --read:#d4761c; --admin:#8a4fd8; --store:#66708a; --bad:#c23a3f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#171b26; --box:#212737; --stroke:#3a4560; --text:#e8ebf4; --muted:#9aa4ba;
              --ingest:#8aa0ff; --asset:#58d39b; --read:#f0a35a; --admin:#c19bff; --store:#9aa4ba; --bad:#ff8f93; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: var(--text); }
    .bg { fill: var(--bg); }
    .title { font-size: 20px; font-weight: 700; }
    .lede { font-size: 13px; fill: var(--muted); }
    .h { font-size: 14px; font-weight: 650; }
    .s { font-size: 11.5px; fill: var(--muted); }
    .lab { font-size: 11.5px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
    .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
    .group { fill: none; stroke: var(--stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .box { fill: var(--box); stroke: var(--stroke); stroke-width: 1.6; }
    .ingest .box, .ingest.box { stroke: var(--ingest); } .ingest .h { fill: var(--ingest); }
    .asset .box, .asset.box { stroke: var(--asset); } .asset .h { fill: var(--asset); }
    .read .box, .read.box { stroke: var(--read); } .read .h { fill: var(--read); }
    .admin .box, .admin.box { stroke: var(--admin); } .admin .h { fill: var(--admin); }
    .store .box, .store.box { stroke: var(--store); } .store .h { fill: var(--text); }
    .bad .box { stroke: var(--bad); } .bad .h { fill: var(--bad); }
    .a { fill: none; stroke-width: 2.2; }
    .a.ingest { stroke: var(--ingest); } .a.asset { stroke: var(--asset); } .a.read { stroke: var(--read); } .a.admin { stroke: var(--admin); }
    .a.bad { stroke: var(--bad); } .a.store { stroke: var(--store); }
    .dash { stroke-dasharray: 7 5; }
    .life { stroke: var(--stroke); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dot { stroke: none; }
    .dot.ingest { fill: var(--ingest); } .dot.asset { fill: var(--asset); } .dot.read { fill: var(--read); } .dot.admin { fill: var(--admin); } .dot.bad { fill: var(--bad); }
    .num { font-size: 12px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .mid { text-anchor: middle; }
  </style><defs><marker id="m-ingest" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dot ingest"/></marker><marker id="m-asset" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dot asset"/></marker><marker id="m-read" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dot read"/></marker><marker id="m-admin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dot admin"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dot bad"/></marker><marker id="m-store" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dot store"/></marker></defs>
<rect class="bg" width="1180" height="740"/>
<text class="title" x="24" y="32">The life of an event</text><text class="lede" x="24" y="52">Numbered steps are clickable in the engineering console. Dashed lines are answers.</text>
<line class="life" x1="150" y1="114" x2="150" y2="700"/>
<line class="life" x1="400" y1="114" x2="400" y2="700"/>
<line class="life" x1="650" y1="114" x2="650" y2="700"/>
<line class="life" x1="890" y1="114" x2="890" y2="700"/>
<line class="life" x1="1090" y1="114" x2="1090" y2="700"/>
<path class="a ingest" d="M156 150 H394" marker-end="url(#m-ingest)"/>
<path class="a ingest" d="M400 210 h46 v26 h-46" marker-end="url(#m-ingest)"/>
<path class="a ingest" d="M406 300 H644" marker-end="url(#m-ingest)"/>
<path class="a ingest dash" d="M394 370 H156" marker-end="url(#m-ingest)"/>
<path class="a ingest" d="M884 450 H656" marker-end="url(#m-ingest)"/>
<path class="a ingest" d="M890 510 h46 v26 h-46" marker-end="url(#m-ingest)"/>
<path class="a ingest" d="M884 590 H656" marker-end="url(#m-ingest)"/>
<path class="a ingest" d="M156 650 H394" marker-end="url(#m-ingest)"/>
<path class="a read" d="M1084 690 H406" marker-end="url(#m-read)"/>
<g class="ingest" data-id="p-cms"><rect class="box" x="80" y="70" width="140" height="44" rx="10"/></g>
<g class="ingest" data-id="p-api"><rect class="box" x="330" y="70" width="140" height="44" rx="10"/></g>
<g class="store" data-id="p-db"><rect class="box" x="580" y="70" width="140" height="44" rx="10"/></g>
<g class="ingest" data-id="p-worker"><rect class="box" x="820" y="70" width="140" height="44" rx="10"/></g>
<g class="read" data-id="p-reader"><rect class="box" x="1020" y="70" width="140" height="44" rx="10"/></g>
<g class="ingest"><text class="h" x="150" y="92" text-anchor="middle">The CMS</text></g>
<g class="ingest"><text class="h" x="400" y="92" text-anchor="middle">Service API</text></g>
<g class="store"><text class="h" x="650" y="92" text-anchor="middle">Database</text></g>
<g class="ingest"><text class="h" x="890" y="92" text-anchor="middle">Batch worker</text></g>
<g class="read"><text class="h" x="1090" y="92" text-anchor="middle">A reader</text></g>
<text class="lab" x="275" y="142" text-anchor="middle">POST /cms/events  [ events ]</text>
<circle class="dot ingest" cx="126" cy="150" r="11"/><text class="num" x="126" y="154">1</text>
<text class="lab" x="458" y="228" text-anchor="start">validate each event, checksum the payload</text>
<circle class="dot ingest" cx="376" cy="210" r="11"/><text class="num" x="376" y="214">2</text>
<text class="lab" x="525" y="292" text-anchor="middle">one transaction: batch + accepted events</text>
<circle class="dot ingest" cx="376" cy="300" r="11"/><text class="num" x="376" y="304">3</text>
<text class="lab" x="275" y="362" text-anchor="middle">202 Accepted  { batchId, results: queued … }</text>
<circle class="dot ingest" cx="424" cy="370" r="11"/><text class="num" x="424" y="374">4</text>
<text class="lab" x="770" y="442" text-anchor="middle">take the oldest due batch</text>
<circle class="dot ingest" cx="914" cy="450" r="11"/><text class="num" x="914" y="454">5</text>
<text class="lab" x="948" y="528" text-anchor="start">reduce each event: a pure function</text>
<circle class="dot ingest" cx="866" cy="510" r="11"/><text class="num" x="866" y="514">6</text>
<text class="lab" x="770" y="582" text-anchor="middle">one transaction: state, outcomes, completed</text>
<circle class="dot ingest" cx="914" cy="590" r="11"/><text class="num" x="914" y="594">7</text>
<text class="lab" x="275" y="642" text-anchor="middle">GET /cms/batches/{id}  →  completed, final outcomes</text>
<circle class="dot ingest" cx="126" cy="650" r="11"/><text class="num" x="126" y="654">8</text>
<text class="lab" x="745" y="682" text-anchor="middle">GET /api/entities/{id}</text>
<circle class="dot read" cx="1114" cy="690" r="11"/><text class="num" x="1114" y="694">9</text>
</svg>
