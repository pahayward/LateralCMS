<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engineering · Lateral CMS</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="eng.css">
</head>
<body class="eng-page">
  <div class="site-bar">
    <span class="brand">Lateral CMS</span>
    <nav aria-label="Site">
      <a href="/">Photos</a>
      <a href="/engineering" aria-current="page">Engineering</a>
    </nav>
    <span class="note">Drive the CMS by hand, see what it does, explain how it works</span>
  </div>

  <div class="eng">
    <aside class="eng-nav" aria-label="Engineering console">
      <div class="target" id="target">
        <div class="target-label">Testing the CMS at</div>
        <code id="cms-url">…</code>
        <div class="row">
          <span id="health-dot" class="dot" title="Not checked yet"></span>
          <span id="health-text" class="hint">checking…</span>
          <button id="health-btn" type="button" class="btn small ghost">Check</button>
        </div>
      </div>
      <nav id="nav" class="nav-groups" aria-label="Views"></nav>
      <div class="nav-foot" id="nav-foot"></div>
    </aside>

    <main class="eng-main" id="eng-main" tabindex="-1">
      <header class="eng-head">
        <h1 id="eng-title">Overview</h1>
        <p id="eng-sub" class="sub"></p>
        <div id="eng-strip" class="ep-strip" hidden aria-label="Endpoints this page calls"></div>
      </header>
      <div id="setup-banner" class="banner bad" hidden></div>
      <div id="eng-view"></div>
    </main>

    <section class="dock" id="dock" aria-label="Request log">
      <details id="dock-details">
        <summary><span>Requests</span> <span id="dock-count" class="chip">0</span>
          <span class="hint">Every call, newest first, with the curl that repeats it. Passwords never appear: the console adds them.</span></summary>
        <div class="dock-actions"><button id="dock-clear" type="button" class="btn small ghost">Clear</button></div>
        <ul id="dock-list" class="dock-list"></ul>
      </details>
    </section>
  </div>

  <div class="toasts" id="eng-toasts" aria-live="polite"></div>

  <script src="eng-core.js"></script>
  <script src="eng-overview.js"></script>
  <script src="eng-design.js"></script>
  <script src="eng-records.js"></script>
  <script src="eng-events.js"></script>
  <script src="eng-assets.js"></script>
  <script src="eng-workbench.js"></script>
  <script src="eng-ops.js"></script>
  <script src="eng-verify.js"></script>
  <script src="eng-start.js"></script>
</body>
</html>
