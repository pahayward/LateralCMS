<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lateral Photos</title>
  <meta name="description" content="A photo library that keeps everything in the Lateral CMS: photos as entities, pictures as scanned assets.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="photos.css">
</head>
<body class="photos">
  <div class="site-bar">
    <span class="brand">Lateral CMS</span>
    <nav aria-label="Site">
      <a href="/" aria-current="page">Photos</a>
      <a href="/engineering">Engineering</a>
    </nav>
    <span class="note">A sample application that keeps everything in the CMS</span>
  </div>

  <div class="app" id="app">
    <header class="app-header" id="app-header">
      <button type="button" class="icon-btn" id="menu-btn" aria-label="Main menu" title="Main menu" data-icon="menu"></button>
      <a class="logo" href="#/photos" aria-label="Lateral Photos">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">Lateral <b>Photos</b></span>
      </a>

      <form class="search" id="search-form" role="search">
        <span class="search-icon" data-icon="search"></span>
        <input id="search" type="search" placeholder="Search your photos" aria-label="Search your photos" autocomplete="off" spellcheck="false">
        <button type="button" class="icon-btn small" id="search-clear" aria-label="Clear search" title="Clear search" data-icon="close" hidden></button>
      </form>

      <div class="header-actions">
        <button type="button" class="icon-btn" id="behind-btn" aria-label="Behind the scenes" title="Behind the scenes: what the CMS is doing" data-icon="code"></button>
        <button type="button" class="btn primary" id="upload-btn"><span data-icon="upload"></span><span class="label">Upload</span></button>
        <input id="file-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>
      </div>

      <div class="selection-bar" id="selection-bar" hidden></div>
    </header>

    <div class="shell">
      <nav class="sidebar" id="sidebar" aria-label="Library"></nav>
      <div class="sidebar-scrim" id="scrim"></div>

      <main class="content" id="content" tabindex="-1" aria-live="polite"></main>
      <div class="scrubber" id="scrubber" hidden aria-hidden="true"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo"></div>
  <aside class="drawer" id="behind" hidden aria-label="Behind the scenes"></aside>
  <section class="tray" id="tray" hidden aria-label="Uploads and downloads"></section>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-layer" id="modals" hidden></div>
  <div class="drop-overlay" id="drop" hidden><div><span data-icon="upload"></span><p>Drop photos to add them to your library</p></div></div>

  <script src="photos-lib.js"></script>
  <script src="photos-store.js"></script>
  <script src="photos-app.js"></script>
</body>
</html>
