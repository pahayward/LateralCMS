<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Lateral CMS</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="site.css">
</head>
<body class="login">
  <main class="login-card">
    <h1>Lateral CMS</h1>
    <p>Sign in to open the photo library or the engineering console.</p>
    <form id="form" autocomplete="on">
      <label for="username">Name</label>
      <input id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="go" type="submit">Sign in</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div class="demo">Demo accounts: <code>admin</code> / <code>admin</code> opens everything; <code>user</code> / <code>password</code> opens the photo library only.</div>
  </main>
  <script src="login.js"></script>
</body>
</html>
