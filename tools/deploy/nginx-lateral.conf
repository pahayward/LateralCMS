# The proxy used to put the CMS website on a public address (see docs/OPERATIONS.md, "Putting the website on the internet").
# Port 8100: the website at the root (LAN or a tunnel of its own). Port 8200: the website under /lateral/ with another site on :8766 at the root.
# It rewrites Host and Origin to localhost because the console only answers to loopback names.
events {}
http {
  map $http_origin $o { default ""; "~.+" "http://localhost"; }
  server {
    listen 8100;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    location / {
      proxy_pass http://127.0.0.1:5100;
      proxy_http_version 1.1;
      proxy_set_header Host localhost;
      proxy_set_header Origin $o;
    }
  }
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  # One public address, two sites: the CMS website under /lateral/, everything else (the CV site on :8766) exactly as before.
  server {
    listen 8200;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    location = /lateral { return 301 /lateral/; }
    location /lateral/ {
      proxy_pass http://127.0.0.1:5100;
      proxy_http_version 1.1;
      proxy_set_header Host localhost;
      proxy_set_header Origin $o;
    }
    location / {
      proxy_pass http://127.0.0.1:8766;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
